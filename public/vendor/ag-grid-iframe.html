<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Grid Enterprise Console View</title>
  
  <!-- Standalone AG Grid Enterprise JS Bundle from local public asset -->
  <script src="./ag-grid-enterprise.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background-color: transparent;
    }

    #myGrid {
      width: 100%;
      height: 100%;
    }

    /* Ultra-Compact Enterprise Theme Tweaks */
    .ag-theme-alpine, .ag-theme-alpine-dark {
      --ag-font-size: 11px;
      --ag-font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --ag-grid-size: 3px;
      --ag-list-item-height: 24px;
      --ag-row-height: 28px;
      --ag-header-height: 32px;
    }

    /* Compact Cell Padding */
    .ag-theme-alpine .ag-cell, .ag-theme-alpine-dark .ag-cell {
      line-height: 26px !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }

    .ag-theme-alpine .ag-header-cell, .ag-theme-alpine-dark .ag-header-cell {
      padding-left: 6px !important;
      padding-right: 6px !important;
    }

    /* Modern Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.4);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }
  </style>
</head>
<body>
  <div id="myGrid" class="ag-theme-alpine-dark"></div>

  <script>
    (function () {
      let gridApi = null;
      const container = document.querySelector('#myGrid');

      // Default AG Grid Enterprise Options with Compact View & Full Feature Suite
      const gridOptions = {
        rowData: [],
        columnDefs: [],
        rowHeight: 28,
        headerHeight: 32,
        animateRows: true,
        rowSelection: { mode: 'multiRow' },
        cellSelection: {
          handle: {
            mode: 'fill'
          }
        },
        allowContextMenuWithControlKey: true,
        rowGroupPanelShow: 'always',
        pivotPanelShow: 'always',
        suppressMenuHide: true,
        sideBar: {
          toolPanels: [
            {
              id: 'columns',
              labelDefault: 'Columns',
              labelKey: 'columns',
              iconKey: 'columns',
              toolPanel: 'agColumnsToolPanel'
            },
            {
              id: 'filters',
              labelDefault: 'Filters',
              labelKey: 'filters',
              iconKey: 'filter',
              toolPanel: 'agFiltersToolPanel'
            }
          ],
          defaultToolPanel: ''
        },
        statusBar: {
          statusPanels: [
            { statusPanel: 'agTotalAndFilteredRowCountComponent', align: 'left' },
            { statusPanel: 'agSelectedRowCountComponent', align: 'left' },
            { statusPanel: 'agAggregationComponent', align: 'right' }
          ]
        },
        defaultColDef: {
          resizable: true,
          sortable: true,
          filter: true,
          floatingFilter: true,
          enableRowGroup: true,
          enablePivot: true,
          enableValue: true,
          minWidth: 100,
          flex: 1
        },
        onGridReady: function(params) {
          gridApi = params.api;
          // Notify parent window that iframe grid is ready
          window.parent.postMessage({ type: 'GRID_READY' }, '*');
        }
      };

      // Create Grid Instance using UMD window.agGrid
      if (window.agGrid && window.agGrid.createGrid) {
        gridApi = window.agGrid.createGrid(container, gridOptions);
      } else if (window.agGrid && window.agGrid.Grid) {
        new window.agGrid.Grid(container, gridOptions);
        gridApi = gridOptions.api;
      }

      // Listen for parent messages (ZERO network API calls inside iframe)
      window.addEventListener('message', function(event) {
        const message = event.data;
        if (!message || typeof message !== 'object') return;

        if (message.type === 'SET_GRID_DATA') {
          const rowData = message.rowData || [];
          const rawCols = message.columnDefs || [];

          // Format Column Definitions
          const formattedCols = rawCols.map(col => ({
            field: col.accessorKey || col.field,
            headerName: col.header || col.headerName || col.field,
            filter: true,
            floatingFilter: true,
            enableRowGroup: true,
            enablePivot: true,
            enableValue: true,
            cellRenderer: function(params) {
              const val = params.value;
              if (val === null || val === undefined) return '<span style="color:#94a3b8;font-style:italic;">null</span>';
              if (typeof val === 'object') return '<span>' + JSON.stringify(val) + '</span>';
              return '<span>' + String(val) + '</span>';
            }
          }));

          if (gridApi) {
            gridApi.setGridOption('columnDefs', formattedCols);
            gridApi.setGridOption('rowData', rowData);
            setTimeout(() => {
              if (gridApi.autoSizeAllColumns) {
                gridApi.autoSizeAllColumns(false);
              }
            }, 50);
          }
        } else if (message.type === 'SET_THEME') {
          if (message.isDark) {
            container.className = 'ag-theme-alpine-dark';
          } else {
            container.className = 'ag-theme-alpine';
          }
        }
      });
    })();
  </script>
</body>
</html>
